# Configuration du virtual host Apache pour le conteneur web. DocumentRoot
# pointe sur /var/www/html (= le bind mount du code). AllowOverride All active
# la prise en compte des .htaccess. Un alias /artify est aussi defini pour
# compat avec d'anciens liens.

# =====================================================================
# Vhost Apache pour servir Artify directement à la racine (/), avec
# l'alias /artify/ -> même contenu, pour que les agents qui utilisent
# http://127.0.0.1/artify/ continuent de marcher.
# =====================================================================
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour rester compatible avec http://127.0.0.1/artify/...
    Alias /artify /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
